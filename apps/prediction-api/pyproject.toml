[project]
name = "prediction-api"
version = "0.1.0"
description = "FastAPI service for crypto signal features, predictions, and model operations."
readme = "README.md"
authors = [
    { name = "trsiam", email = "trsiam3468@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.13",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]